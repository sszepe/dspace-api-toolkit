[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=dspace_api
    --cov-config=.coveragerc
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml

markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    auth: marks tests related to authentication
    items: marks tests related to item management
    workspace: marks tests related to workspace items
    bundles: marks tests related to bundles and bitstreams
    permissions: marks tests related to resource policies and access control
    collections: marks tests related to collections
    discovery: marks tests related to search and discovery
    vocabulary: marks tests related to vocabularies
    utils: marks tests related to utility functions

minversion = 6.0

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
