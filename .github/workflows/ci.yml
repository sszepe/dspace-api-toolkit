# Unit tests (100% coverage gate) on every push / PR, Python 3.10-3.14,
# Linux + Windows; builds and checks the distributions; on main also runs a
# smoke integration test against one DSpace stack.
# we can then run integration tests against multiple DSpace stacks if needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest      # pytest.ini: coverage report + .coveragerc fail_under=100
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: coverage-html
          path: htmlcov/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Wheel contains only the package
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          bad = [n for n in names if not n.startswith(("dspace_api/", "dspace_api_toolkit-"))]
          assert not bad, bad
          print(len(names), "files ok")
          PY
      - name: Install the wheel in a clean venv and import it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/python -c "import dspace_api, sys; print(dspace_api.__version__); from dspace_api import DSpaceClient"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  integration-smoke:
    # One real stack on main pushes - catches "works with mocks, breaks on DSpace" early.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit
    uses: ./.github/workflows/integration-matrix.yml
    secrets: inherit
    with:
      targets: "dspace-9"
